services:
  frontend-admin:
    image: ghcr.io/centrogeo/sigic-nuxt-frontend:develop
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NUXT_APP_BASE_URL: /admin/
        NUXT_PUBLIC_AUTH_BASE_URL: ${NGINX_BASE_URL}/admin/api/auth
        NUXT_PUBLIC_BASE_URL: ${NGINX_BASE_URL}
        NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL: ${NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL}
        NUXT_PUBLIC_KEYCLOAK_ISSUER: ${SOCIALACCOUNT_OIDC_ID_TOKEN_ISSUER}
    container_name: frontendadmin4sigic
    ports:
      - '3001:3000'
    expose:
      - '3000'
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - landing_builder_data:/app/.data
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_BASE_URL: ${NGINX_BASE_URL}
      NUXT_PUBLIC_GEONODE_URL: ${NGINX_BASE_URL}
      NUXT_PUBLIC_GEONODE_API: ${NGINX_BASE_URL}/api/v2
      NUXT_PUBLIC_GEOSERVER_URL: ${NGINX_BASE_URL}/gs
      NUXT_PUBLIC_IA_BACKEND_URL: ${NGINX_BASE_URL}/llmb
      NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL: ${NGINX_BASE_URL}/levantamiento
      NUXT_PUBLIC_DEFAULT_PAGE: ${NUXT_PUBLIC_DEFAULT_PAGE:-/}
      NUXT_PUBLIC_KEYCLOAK_ISSUER: ${SOCIALACCOUNT_OIDC_ID_TOKEN_ISSUER:-${NGINX_BASE_URL}/iam/realms/sigic}
      NUXT_AUTH_ORIGIN: ${NUXT_AUTH_ORIGIN}
      NUXT_PUBLIC_AUTH_BASE_URL: ${NGINX_BASE_URL}/admin/api/auth
      KEYCLOAK_ISSUER: ${NGINX_BASE_URL}/iam/realms/sigic
      NUXT_PUBLIC_ENABLE_AUTH: true
      NUXT_PUBLIC_ENABLE_CATALOGO_VISTA: true
      NUXT_PUBLIC_ENABLE_CATALOGO_CARGA: true
      NUXT_PUBLIC_ENABLE_CONSULTA: true
      NUXT_PUBLIC_ENABLE_IAA: true
      NUXT_PUBLIC_ENABLE_LEVANTAMIENTO: true
      NUXT_PUBLIC_ENABLE_MAPAS: true
      NUXT_PUBLIC_ENABLE_ACERCA_DE: true
      NUXT_PUBLIC_ENABLE_GEOCONTENIDOS: true
      NUXT_PUBLIC_ENABLE_GEOHISTORIAS: true
      NUXT_PUBLIC_ENABLE_TABLEROS: true
      NUXT_PUBLIC_ENABLE_PANORAMAS: true
      NUXT_PUBLIC_ENABLE_LANDING_BUILDER: true
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET}
      NUXT_APP_BASE_URL: /admin/
      NUXT_PUBLIC_OLLAMA_MODEL: ${NUXT_PUBLIC_OLLAMA_MODEL}
    networks:
      - sigic
  frontend-app:
    image: ghcr.io/centrogeo/sigic-nuxt-frontend:develop
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NUXT_APP_BASE_URL: /app/
        NUXT_PUBLIC_AUTH_BASE_URL: ${NGINX_BASE_URL}/app/api/auth
        NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL: ${NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL}
        NUXT_PUBLIC_KEYCLOAK_ISSUER: ${SOCIALACCOUNT_OIDC_ID_TOKEN_ISSUER}
    container_name: frontendapp4sigic
    ports:
      - '3002:3000'
    expose:
      - '3000'
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - landing_builder_data:/app/.data
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_BASE_URL: ${NGINX_BASE_URL}
      NUXT_PUBLIC_GEONODE_URL: ${NGINX_BASE_URL}
      NUXT_PUBLIC_GEONODE_API: ${NGINX_BASE_URL}/api/v2
      NUXT_PUBLIC_GEOSERVER_URL: ${NGINX_BASE_URL}/gs
      NUXT_PUBLIC_IA_BACKEND_URL: ${NGINX_BASE_URL}/llmb
      NUXT_PUBLIC_LEVANTAMIENTO_BACKEND_URL: ${NGINX_BASE_URL}/levantamiento
      NUXT_PUBLIC_DEFAULT_PAGE: ${NUXT_PUBLIC_DEFAULT_PAGE:-/}
      NUXT_PUBLIC_KEYCLOAK_ISSUER: ${SOCIALACCOUNT_OIDC_ID_TOKEN_ISSUER:-${NGINX_BASE_URL}/iam/realms/sigic}
      # NUXT_AUTH_ORIGIN: ${NUXT_AUTH_ORIGIN}
      NUXT_PUBLIC_AUTH_BASE_URL: ${NGINX_BASE_URL}/app/api/auth
      KEYCLOAK_ISSUER: ${NGINX_BASE_URL}/iam/realms/sigic
      NUXT_PUBLIC_ENABLE_AUTH: false
      NUXT_PUBLIC_ENABLE_CATALOGO_VISTA: false
      NUXT_PUBLIC_ENABLE_CATALOGO_CARGA: false
      NUXT_PUBLIC_ENABLE_CONSULTA: true
      NUXT_PUBLIC_ENABLE_IAA: false
      NUXT_PUBLIC_ENABLE_LEVANTAMIENTO: false
      NUXT_PUBLIC_ENABLE_MAPAS: false
      NUXT_PUBLIC_ENABLE_ACERCA_DE: true
      NUXT_PUBLIC_ENABLE_GEOCONTENIDOS: false
      NUXT_PUBLIC_ENABLE_GEOHISTORIAS: false
      NUXT_PUBLIC_ENABLE_TABLEROS: false
      NUXT_PUBLIC_ENABLE_PANORAMAS: false
      NUXT_PUBLIC_ENABLE_LANDING_BUILDER: false
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET}
      NUXT_APP_BASE_URL: /app/
      NUXT_PUBLIC_OLLAMA_MODEL: '${OLLAMA_MODEL:-deepseek-r1}'
    networks:
      - sigic

networks:
  sigic:
    name: sigic_sigicnetwork
    external: true

volumes:
  landing_builder_data:
    name: ${COMPOSE_PROJECT_NAME}-landing_builder_data
